<!DOCTYPE html>
<html>
<head>
    <title>Register | Placement Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: linear-gradient(135deg, #2196F3, #0d47a1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        h2 {
            margin: 0 0 25px 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2196F3;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1565c0;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .login {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>Create Account</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>

    <div class="login">
        Already have an account? <a href="/login/">Login</a>
    </div>

</div>

</body>
</html>
