<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f4f6f9;
        }

        a {
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, select {
            padding: 8px;
            margin-right: 10px;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .complete-btn {
            background: #4CAF50;
            color: white;
        }

        .undo-btn {
            background: #ff9800;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .task-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

<a href="/dashboard-ui/">← Back to Dashboard</a>

<h2>My Tasks</h2>

<div class="card">
    <input type="text" id="title" placeholder="Task Title">

    <!-- IMPORTANT: VALUES MUST MATCH MODEL EXACTLY -->
    <select id="category">
        <option value="DSA">DSA</option>
        <option value="CORE">Core Subjects</option>
        <option value="APTITUDE">Aptitude</option>
        <option value="PROJECT">Project</option>
    </select>

    <button onclick="addTask()">Add Task</button>
</div>

<div class="card" id="taskContainer"></div>

<script>
/* ================= CSRF ================= */
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie('csrftoken');


/* ================= LOAD TASKS ================= */
async function loadTasks() {

    const response = await fetch("/api/tasks/");
    const data = await response.json();

    const container = document.getElementById("taskContainer");
    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = "<p>No tasks added yet.</p>";
        return;
    }

    data.forEach(task => {

        const div = document.createElement("div");
        div.className = "task-item";

        div.innerHTML = `
            <strong>${task.title}</strong> (${task.category})
            - ${task.status}

            <button 
                class="${task.status === 'completed' ? 'undo-btn' : 'complete-btn'}"
                onclick="toggleTask(${task.id}, '${task.status}')">
                ${task.status === 'completed' ? 'Undo' : 'Complete'}
            </button>

            <button 
                class="delete-btn"
                onclick="deleteTask(${task.id})">
                Delete
            </button>
        `;

        container.appendChild(div);
    });
}


/* ================= ADD TASK ================= */
async function addTask() {

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;

    if (!title) {
        alert("Task title required");
        return;
    }

    const response = await fetch("/api/tasks/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
        },
        body: JSON.stringify({
            title: title,
            category: category,
            status: "pending"
        })
    });

    if (!response.ok) {
        const errorData = await response.json();
        console.log(errorData);
        alert("Failed to add task");
        return;
    }

    document.getElementById("title").value = "";
    loadTasks();
}


/* ================= TOGGLE ================= */
async function toggleTask(id, currentStatus) {

    const newStatus = currentStatus === "completed"
        ? "pending"
        : "completed";

    await fetch(`/api/tasks/${id}/`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
        },
        body: JSON.stringify({
            status: newStatus
        })
    });

    loadTasks();
}


/* ================= DELETE ================= */
async function deleteTask(id) {

    await fetch(`/api/tasks/${id}/`, {
        method: "DELETE",
        headers: {
            "X-CSRFToken": csrftoken
        }
    });

    loadTasks();
}

loadTasks();
</script>

</body>
</html>
